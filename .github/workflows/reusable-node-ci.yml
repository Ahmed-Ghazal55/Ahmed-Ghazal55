name: Reusable Node and TypeScript CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version compatible with the caller project
        type: string
        required: false
        default: '24'
      working-directory:
        description: Relative path to the package.json directory
        type: string
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  verify-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install locked dependencies
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          cd -- "$PROJECT_DIR"
          test -f package-lock.json || { echo 'A package-lock.json is required for reproducible builds'; exit 1; }
          npm ci --ignore-scripts
      - name: Check lint, build, and CI tests when scripts exist
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          cd -- "$PROJECT_DIR"
          npm run lint --if-present
          npm run build --if-present
          npm run test:ci --if-present
# Callers must define lint, build and test:ci scripts as appropriate.
# --ignore-scripts is intentional until repository dependency provenance has been reviewed.
