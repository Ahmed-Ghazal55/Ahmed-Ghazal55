name: Reusable Node and TypeScript CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version compatible with the caller project
        type: string
        required: false
        default: '24'
      working-directory:
        description: Relative path to the package.json directory
        type: string
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  verify-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install locked dependencies
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          cd -- "$PROJECT_DIR"
          test -f package-lock.json || { echo 'A package-lock.json is required for reproducible builds'; exit 1; }
          npm ci --ignore-scripts
      - name: Require lint, build and test:ci scripts
        env:
          PROJECT_DIR: ${{ inputs.working-directory }}
        run: |
          cd -- "$PROJECT_DIR"
          node -e 'const p=require("./package.json"); for (const s of ["lint","build","test:ci"]) if (!p.scripts?.[s]) { console.error("Missing required npm script:", s); process.exitCode=1; }'
          npm run lint
          npm run build
          npm run test:ci
# Callers MUST define lint, build, and test:ci scripts. Passing CI requires real checks.
# --ignore-scripts is intentional until repository dependency provenance has been reviewed.
