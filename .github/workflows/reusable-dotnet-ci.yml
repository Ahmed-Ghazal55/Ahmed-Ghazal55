name: Reusable .NET and C# CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: Installed .NET SDK version or supported release channel
        type: string
        required: false
        default: '10.0.x'
      target:
        description: Relative path to a trusted solution or project file
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        env:
          DOTNET_TARGET: ${{ inputs.target }}
        shell: bash
        run: dotnet restore "$DOTNET_TARGET"
      - name: Build without restore
        env:
          DOTNET_TARGET: ${{ inputs.target }}
        shell: bash
        run: dotnet build "$DOTNET_TARGET" --no-restore --configuration Release
      - name: Run tests
        env:
          DOTNET_TARGET: ${{ inputs.target }}
        shell: bash
        run: dotnet test "$DOTNET_TARGET" --no-restore --configuration Release --verbosity normal
# Specify each project's real SDK and solution/test targets in its caller workflow.
# Linux jobs cannot validate Windows-only projects or their native dependencies.
