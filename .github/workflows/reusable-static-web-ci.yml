name: Reusable static web CI

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  check-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inspect static website source
        env:
          WEB_DIR: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          cd -- "$WEB_DIR"
          test -f index.html || { echo "Missing index.html"; exit 1; }
          python3 - <<'PY'
          import html.parser, pathlib, sys
          class HTMLCheck(html.parser.HTMLParser):
              pass
          count = 0
          for path in pathlib.Path('.').rglob('*.html'):
              if any(part in {'node_modules','.git','dist','build','.next'} for part in path.parts): continue
              HTMLCheck().feed(path.read_text(encoding='utf-8'))
              count += 1
          print(f'Parsed {count} HTML files')
          if count == 0: sys.exit(1)
          PY
          while IFS= read -r -d '' jsfile; do
            node --check "$jsfile"
          done < <(find . -type d \( -name node_modules -o -name .git -o -name dist -o -name build -o -name .next \) -prune -o -type f -name '*.js' -print0)
# Syntax checks only: not a browser E2E test, dependency audit or complete HTML validator.
