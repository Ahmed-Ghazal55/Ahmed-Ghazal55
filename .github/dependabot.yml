version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/engineering/fixtures/node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
  - package-ecosystem: "nuget"
    directory: "/engineering/fixtures/dotnet/Smoke.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
